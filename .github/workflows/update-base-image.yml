name: Update Base Image

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Writes (branch push, PR creation) use the LuskTech-Neko app token below,
# so the default token only needs to read the repository.
permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for Ubuntu updates
        id: check
        run: |
          CURRENT=$(grep "^FROM ubuntu:" Dockerfile | head -1 | cut -d: -f2)

          # Query the specific 24.04 tag directly rather than paginating all tags.
          # ubuntu:24.04 is intentionally pinned — Landscape Server quickstart mode
          # is unsupported on Ubuntu 26.04 per Canonical docs.
          LATEST=$(curl -sf \
            "https://registry.hub.docker.com/v2/repositories/library/ubuntu/tags/24.04" | \
            jq -r '.name // empty')

          # Bail out if the API call failed or returned nothing — never commit a blank tag.
          if [ -z "$LATEST" ]; then
            echo "Could not determine latest Ubuntu 24.04 tag — skipping update" >&2
            exit 0
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.update_available == 'true'
        run: |
          sed -i \
            "s|FROM ubuntu:${{ steps.check.outputs.current }}|FROM ubuntu:${{ steps.check.outputs.latest }}|g" \
            Dockerfile

      # Events caused by the default GITHUB_TOKEN never trigger other workflows,
      # so a PR opened with it gets no CI. The app token does trigger them.
      - name: Generate LuskTech-Neko app token
        if: steps.check.outputs.update_available == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update Ubuntu base image to ${{ steps.check.outputs.latest }}"
          title: "Update Ubuntu base image to ${{ steps.check.outputs.latest }}"
          body: |
            Automated update of Ubuntu base image.

            - Current: `${{ steps.check.outputs.current }}`
            - Latest: `${{ steps.check.outputs.latest }}`

            > **Note:** ubuntu:24.04 is intentionally pinned. Landscape quickstart
            > is unsupported on Ubuntu 26.04 per Canonical docs:
            > https://ubuntu.com/landscape/docs/how-to-guides/landscape-installation-and-set-up/quickstart-installation/
          branch: update-ubuntu-base
          delete-branch: true
