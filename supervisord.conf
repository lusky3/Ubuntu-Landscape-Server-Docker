; ------------------------------------------------------ companion snap services
; landscape-outbox, landscape-task-handler and landscape-debarchive are distributed only as snaps. They
; are unpacked in the image (/opt/snaps) and run directly; /usr/local/bin/snapctl
; is a shim for the `snapctl get` calls they make. The snaps' timer units are
; replaced by /etc/cron.d/landscape-snap-timers.

; snap landscape-outbox, app "outbox" (daemon: simple, restart always)
[program:landscape-outbox]
command=/usr/local/bin/ls-run outbox /opt/snaps/landscape-outbox/snap/local/start-outbox.sh
user=landscape
autostart=false
priority=40
startsecs=15
startretries=5
; the snap declares "restart always"; supervisord's default only restarts on unexpected exits.
autorestart=true
stopasgroup=true
killasgroup=true
environment=SNAP="/opt/snaps/landscape-outbox",SNAP_NAME="landscape-outbox",SNAP_DATA="/var/lib/landscape/outbox",SNAP_COMMON="/var/lib/landscape/outbox",LANDSCAPE_CONFIG_FILE="/etc/landscape/service.conf"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; snap landscape-debarchive, app "debarchive" (serves /debarchive via Apache on :8100;
; the bundled Temporal server is not shipped, so long-running operations stay in memory)
[program:landscape-debarchive]
command=/usr/local/bin/ls-run debarchive /opt/snaps/landscape-debarchive/snap/local/start-debarchive.sh
user=landscape
autostart=false
priority=40
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
environment=SNAP="/opt/snaps/landscape-debarchive",SNAP_NAME="landscape-debarchive",SNAP_DATA="/var/lib/landscape/debarchive",SNAP_COMMON="/var/lib/landscape/debarchive",LANDSCAPE_CONFIG_FILE="/etc/landscape/service.conf",DEB_ARCHIVE_DATABASE_NAME="landscape-standalone-debarchive"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; snap landscape-task-handler, apps "server" (gRPC mTLS on 127.0.0.1:50053; creates its
; queue table in the main DB) and "worker" (executes the hard deletion of
; soft-deleted computers). Started via ls-task-handler, which derives the
; database settings from service.conf.
[program:landscape-task-handler-server]
command=/usr/local/bin/ls-run task-handler-server /usr/local/bin/ls-task-handler server
user=landscape
autostart=false
priority=35
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:landscape-task-handler-worker]
command=/usr/local/bin/ls-run task-handler-worker /usr/local/bin/ls-task-handler worker
user=landscape
autostart=false
priority=36
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:ls]
programs=landscape-api,landscape-appserver,landscape-async-frontend,landscape-job-handler,landscape-msgserver,landscape-package-upload,landscape-pingserver,landscape-package-search,landscape-hostagent-consumer,landscape-hostagent-messenger,landscape-secrets-service,landscape-outbox,landscape-debarchive,landscape-task-handler-server,landscape-task-handler-worker,apache,cron
