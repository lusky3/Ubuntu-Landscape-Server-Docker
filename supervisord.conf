; Process supervision for the single-container Landscape server.
;
; This file replaces the systemd units shipped in landscape-server 26.04
; (landscape-server.target and its Wants=). Unit -> program mapping, with the
; same User=, Environment= and ExecStart= as /lib/systemd/system/landscape-*.service.
;
; Only postgres and rabbitmq autostart; entrypoint.sh starts group "ls" once
; first-run provisioning and the schema migration are finished.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Any program reaching FATAL (start retries exhausted, systemd's StartLimitBurst
; equivalent) makes the whole container exit so the failure is visible.
[eventlistener:fatal]
command=/usr/local/bin/ls-fatal-listener
events=PROCESS_STATE_FATAL
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------- infrastructure

; Several Landscape services (package-search, the OWASP security logger) write
; to /dev/log and fail without a syslog daemon.
[program:rsyslog]
command=/usr/sbin/rsyslogd -n -iNONE
priority=5
startsecs=3
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
priority=10
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
environment=HOME="/var/lib/rabbitmq"
priority=10
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------ landscape services
; Ordering: ls-run waits for postgres:5432 and rabbitmq:5672 before exec.

[program:apache]
command=/usr/local/bin/ls-apache
autostart=false
priority=50
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
; apache2ctl runs apache2 as a child and does not forward TERM, so signal the group.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f
autostart=false
priority=60
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; landscape-api.service
[program:landscape-api]
command=/usr/local/bin/ls-run api /opt/canonical/landscape/landscape-server api
user=landscape
autostart=false
priority=30
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
environment=LANDSCAPE_CONFIG_FILE="/opt/canonical/landscape/configs/standalone/service.conf",LANDSCAPE_SYSTEM__DEPLOYMENT_MODE="standalone",REQUESTS_CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

