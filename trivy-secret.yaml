# Trivy secret-scan allowlist, read automatically from the repo root by the
# image scans in build.yml / build-clients.yml (gate and Security-tab upload).
#
# Only third-party files that ship in the published images and that this repo
# cannot change are listed. Anything else Trivy finds still fails the build.
allow-rules:
  - id: landscape-sample-stripe-test-keys
    description: >-
      Stripe test-mode keys (sk_test_/pk_test_) in Canonical's Landscape sample
      module; upstream's own comment says they belong to an account used for
      testing purposes.
    path: (^|/)opt/canonical/landscape/canonical/landscape/sample/

  - id: ubuntu-ssl-cert-snakeoil-key
    description: >-
      Publicly known default key generated by Ubuntu's ssl-cert package.
      Not used for Landscape's own HTTPS certificate.
    path: (^|/)etc/ssl/private/ssl-cert-snakeoil\.key$
